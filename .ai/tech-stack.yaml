project_name: Parking Finder
last_reviewed: 2026-05-27

architecture:
  style: monolith (modular)
  goal: portfolio + system design showcase

frontend:
  framework: angular
  version: 21.x
  ui:
    - tailwindcss 4.x
    - leaflet 1.9.x
    - lucide icons
  notes:
    - use rxjs for async data
    - prefer resolver for prefetch data

backend:
  framework: spring boot
  spring_boot_version: 3.3.5
  language: java
  java_version: 17
  security:
    - spring security 6
    - jjwt 0.12.x
  api_docs:
    - springdoc openapi (swagger-ui)
  patterns:
    - layered architecture
    - service + repository pattern

database:
  primary: postgresql
  extension: postgis
  usage:
    - store parking locations
    - geo queries (nearby search)

cache:
  provider: redis
  usage:
    - cache parking availability
    - atomic slot reservation gate (lua + decr)
    - optional pub/sub for realtime

realtime:
  method: websocket (optional)
  fallback: polling

auth:
  mode: jwt stateless
  access_token: bearer token
  refresh_token: httpOnly cookie + hashed persistence

testing:
  backend:
    - spring boot test
    - mockmvc
    - junit 5

mobile:
  strategy: pwa first

  phase_3_user_journey:
    status: done
    note: "Auth + booking lifecycle — must come BEFORE realtime (WS needs identity)"
    backend_tasks:
      - id: basic_auth_jwt
        status: done
        note: "Spring Security + JWT access/refresh flow, auth endpoints, secured /bookings, booking userId sourced from JWT principal"
      - id: current_user_endpoint
        status: done
        note: "GET /users/me implemented with JWT principal resolution and secured route"
      - id: booking_history_api
        status: done
        note: "GET /bookings with page/size/sort/status supports Spring Page response scoped to authenticated principal"
      - id: swagger_api_docs_standardization
        status: done
        note: "Springdoc Swagger UI enabled, OpenAPI bearer scheme configured, and endpoint tag/summary/description/response annotations standardized"
      - id: active_booking_api
        status: done
        note: "GET /bookings/active returns current user's ACTIVE booking as enriched BookingDetailResponse; empty result returns HTTP 200 with empty body"
      - id: booking_detail_api
        status: done
        note: "GET /bookings/{bookingId} returns enriched BookingDetailResponse (parkingName, address, hourlyRate) scoped to authenticated principal; 404 for both not-found and wrong-owner"
      - id: booking_ownership_hardening
        status: done
        note: "cancelBooking renamed to cancelBookingForUser(Long, String); ownership enforced via .filter(b -> b.getUserId().equals(userId)) before orElseThrow; controller passes @AuthenticationPrincipal username; 404 returned for both not-found and wrong-owner to prevent ID enumeration"

    frontend_tasks:
      - id: sign_in_page
        status: done
        note: "Map-persistent auth overlay implemented; /auth/sign-in kept as compatibility redirect to /map with modal intent"
      - id: sign_up_page

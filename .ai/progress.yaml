      - id: auth_state_management
        status: done
        note: "HTTP interceptor attaches Bearer token, authGuard protects booking routes, AuthSessionService holds access token, withInterceptors wired in main.ts bootstrap"
      - id: current_booking_view
        status: done
        note: "Current booking banner wired to GET /bookings/active and locally seeded from new PENDING reservations with parking name, countdown, dismiss, and booking-detail action"
      - id: booking_history_view
        status: done
        note: "Right-side Context Panel replacing Profile: back header with count, chronological activity timeline, load-more pagination, and extracted reservation-style Booking Detail drill-in. Map remains mounted."
      - id: map_shell_nested_routing
        status: done
        note: "Added /map, /map/:parkingId, /map/:parkingId/booking routes with persistent shell and route-driven state"
      - id: booking_overlay_route
        status: done
        note: "Booking confirmation overlay now appears on /map/:parkingId/booking and keeps map mounted"
      - id: auth_return_to_intent
        status: done
        note: "Auth modal and /auth/* redirect bridge preserve returnUrl; booking intent resumed after sign-in via route state"
      - id: profile_view
        status: done
        note: "Minimal profile drawer: compact sticky header (avatar + name + email + Detail Panel-style close), recent booking preview (1 item, View History), vehicle preview (max 2, View All), payment preview (primary card, Manage), sign-out. Settings/Edit Profile deferred to future Settings View."
      - id: mobile_desktop_overlay_parity
        status: done
        note: "Same route/state, different presentation: desktop right drawer, mobile bottom sheet for detail, profile, and booking history panels"
      - id: booking_center_redesign
        status: done
        note: "Replaced Booking History with user-centric My Bookings panel: Current Reservation section (ACTIVE/PENDING) + Recent Bookings (COMPLETED/CANCELLED/EXPIRED); renamed component to BookingCenterPanel"
      - id: active_booking_card
        status: done
        note: "Current Reservation card with parking identity, status badge, live countdown, distance, end time, View Details and Navigate actions"
      - id: booking_history_separation
        status: done
        note: "Timeline now filters to only past bookings (COMPLETED/CANCELLED/EXPIRED); active/pending bookings promoted to separate section"
      - id: booking_detail_consumer_ui
        status: done
        note: "Redesigned from admin-CRUD to consumer reservation detail: hero section (parking name, status, countdown, distance), promoted actions, card-based reservation summary, sentence case throughout, Booking ID de-emphasized to Ref #N subtitle"
      - id: cancel_booking_flow
        status: done
        note: "Frontend cancel action uses a destructive confirmation dialog, calls the ownership-scoped cancel API, prevents duplicate requests, refreshes local availability and booking state, and surfaces status-specific errors"

  phase_4_realtime:
    status: done
    note: "Realtime availability is complete from committed PostgreSQL change through Redis Pub/Sub and STOMP to the Angular UI, with REST recovery and freshness labels"
    backend_tasks:
      - id: availability_consistency_baseline
        status: done
        note: "PostgreSQL owns bounded availability; Redis reservation is compensated on rollback; after-commit absolute events refresh Redis projections; REST overlays fresh DB availability on cached parking metadata"
      - id: websocket_setup
        status: done
        note: "Native /ws STOMP endpoint with /topic/parking-availability, 10s simple-broker heartbeats, origin allowlist, read-only inbound interceptor, and isolated handshake/payload integration tests"
      - id: redis_pubsub
        status: done
        note: "After-commit availability events publish as JSON to parking.availability.v1; one exact-topic Redis subscriber per backend instance forwards them to the local STOMP broker with failure isolation"
      - id: simulate_occupancy
        status: done
        note: "ROLE_ADMIN-protected ENTER/EXIT endpoint applies guarded PostgreSQL availability updates, Redis admission/compensation, and after-commit OCCUPANCY events"
      - id: phase_4_closeout
        status: done
        note: "Docker-backed PostGIS/Redis integration test proves authenticated occupancy ENTER/EXIT through native STOMP, with a repeatable browser demo runbook and synchronized architecture documentation"
    frontend_tasks:
      - id: websocket_client
        status: done
        note: "Singleton native STOMP client exposes validated typed availability events and connection state, with 10s heartbeats, exponential reconnect, idempotent lifecycle, and duplicate-subscription protection"
      - id: realtime_slot_update_ui
        status: done
        note: "Shell consumes absolute STOMP events across map/list/detail state, ignores stale updates, polls REST while unavailable, resyncs after reconnect, and uses authoritative refreshes after booking/cancellation"
      - id: availability_timestamp
        status: done
        note: "Parking cards show accessible relative freshness from updatedAt using one sidebar-owned one-second clock, with clock-skew clamping and invalid-timestamp fallback"

  phase_5_ux_and_integrations:
    status: in_progress
    note: "Phase 5 begins with cache optimization while preserving PostgreSQL as the availability authority"
    backend_tasks:
      - id: cache_optimization
        status: pending
      - id: error_contract_hardening
        status: pending
      - id: google_oauth2
        status: pending
        note: "OAuth2 with Google as login option — after basic auth is stable"
    frontend_tasks:
      - id: loading_state
        status: pending
      - id: error_state
        status: pending
      - id: current_position_marker
        status: pending
        note: "Geolocation API + pulsing blue dot marker for user location"
      - id: directions_deeplink
        status: pending
        note: "Google Maps deep-link with proper origin/destination params"
      - id: highlight_almost_full
        status: pending
      - id: filter_chips
        status: pending
        note: "EV charging, roofed, price range — data already in V3 seed"
      - id: active_booking_banner
        status: pending
        note: "Persistent banner: 'You have a reservation at X — 42 min remaining'"

notes:
  - "Phase reorder: Auth before Realtime — WS connections need user identity."
  - "Flexible booking duration is core booking flow, NOT UX polish — stays in phase 2."
  - "Booking status lifecycle (PENDING/ACTIVE/COMPLETED/CANCELLED/EXPIRED) is portfolio gold for backend thinking."
  - "simulate_occupancy in phase 4 enables powerful live demo without real IoT hardware."
  - "OAuth2 Google deferred to phase 5 — basic JWT auth ships faster and shows more engineering depth."
  - "Payment integration intentionally excluded — high effort, low portfolio ROI."
  - "Race condition was reproduced via Postman and a basic script with 10 simultaneous booking requests."
  - "Redis atomic booking gate is enabled with fail-closed behavior when Redis is unavailable."

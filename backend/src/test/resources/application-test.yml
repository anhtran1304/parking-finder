spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect

app:
  jwt:
    secret: test-secret-key-that-is-at-least-32-chars-long
    access-token-expiry-seconds: 900
    refresh-token-expiry-days: 7
    cookie-secure: false

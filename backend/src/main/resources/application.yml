spring:
  application:
    name: parking-finder-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  task:
    scheduling:
      pool:
        size: 2
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-key-change-this-before-prod-12345}
    access-token-expiry-seconds: ${JWT_ACCESS_EXPIRY:900}
    refresh-token-expiry-days: ${JWT_REFRESH_EXPIRY_DAYS:7}
    cookie-secure: ${JWT_COOKIE_SECURE:false}
  cache:
    parking-detail-ttl-seconds: ${PARKING_DETAIL_TTL_SECONDS:300}
    nearby-ttl-seconds: ${PARKING_NEARBY_TTL_SECONDS:300}

logging:
  level:
    com.parkingfinder: INFO
